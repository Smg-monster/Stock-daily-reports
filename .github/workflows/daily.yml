name: daily-report

env:
  # 除非你有特殊需求，否則這個環境變數通常不需要
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true 

on:
  schedule:
    # 建議改為台灣時間開盤期間（週一至週五 9:00~14:00，對應 UTC 1:00~6:00）
    # 或是維持每小時跑一次也行，但建議加上手動測試按鈕
    - cron: '1 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 必須加上這個，否則無法 commit 回去
          fetch-depth: 0 

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 如果你的 requirements.txt 很簡單，也可以改用：
      # run: pip install requests pandas
      - run: |
          pip install -r requirements.txt

      - name: 執行成交值檢測
        run: python stock_alert.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Commit and Push if changed
        # 使用 git add . 或指定檔案，並增加對沒變動時的處理
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add last_turnover.txt
          if git diff --staged --quiet; then
            echo "無變動，跳過 Commit"
          else
            git commit -m "update: 自動更新成交值紀錄"
            git push origin main
          fi
